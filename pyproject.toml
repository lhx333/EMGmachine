[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "full-system"
version = "0.1.0"
description = "Windows multimodal acquisition host"
requires-python = ">=3.10,<3.11"
dependencies = ["h5py>=3.9", "numpy>=1.24", "PySide6-Essentials>=6.6", "matplotlib>=3.5", "onnxruntime-directml>=1.15.0", "pyserial>=3.5", "crcmod>=1.7", "pc-ble-driver-py>=0.15", "pyrealsense2==2.58.2.10647", "opencv-python-headless==4.11.0.86"]

[project.scripts]
full-system = "acquisition.app:main"
full-system-import-legacy = "acquisition.legacy_import_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
